<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibez Protocol — Admin</title>
  <!-- Absolute /static paths: this page is served at /admin, so relative
       "assets/..." would resolve to /assets/... and 404. -->
  <link rel="icon" href="/static/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#060608">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#060608; --surface:#0e0e12; --surface2:#16161c;
      --accent:#00ff9d; --accent2:#7c5cfc; --text:#f0ede8;
      --muted:#6b6880; --border:#1e1e28; --danger:#ff4d6d;
      --font-display:'Syne',sans-serif;
      --font-mono:'DM Mono',monospace;
      --font-body:'Instrument Sans',sans-serif;
    }
    body { background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; }

    /* LOGIN */
    .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .login-card { background:var(--surface); border:1px solid var(--border); padding:2.5rem; width:100%; max-width:380px; }
    .login-mark { height:2.6rem; width:auto; display:block; margin-bottom:0.9rem;
                  filter:drop-shadow(0 0 14px rgba(124,92,252,0.4)); }
    .topbar-mark { height:1.5rem; width:auto; vertical-align:middle; margin-right:0.5rem; }
    .login-logo { font-family:var(--font-display); font-weight:800; font-size:1.3rem; margin-bottom:0.25rem; }
    .login-logo span { color:var(--accent); }
    .login-sub { font-family:var(--font-mono); font-size:0.7rem; color:var(--muted); letter-spacing:0.1em; margin-bottom:2rem; }
    .field { margin-bottom:1rem; }
    .field label { font-family:var(--font-mono); font-size:0.7rem; color:var(--muted); letter-spacing:0.1em; display:block; margin-bottom:0.4rem; }
    .field input, .field textarea { width:100%; padding:0.75rem 1rem; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:var(--font-body); font-size:0.9rem; outline:none; transition:border-color 0.2s; }
    .field input:focus, .field textarea:focus { border-color:var(--accent); }
    .field textarea { resize:vertical; min-height:100px; }
    .btn { font-family:var(--font-mono); font-size:0.78rem; padding:0.75rem 1.5rem; cursor:pointer; letter-spacing:0.08em; border:none; transition:all 0.2s; }
    .btn-accent { background:var(--accent); color:var(--bg); }
    .btn-accent:hover { background:#00e08a; }
    .btn-outline { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
    .btn-sm { font-size:0.68rem; padding:0.4rem 0.75rem; }
    .btn-danger { background:transparent; border:1px solid var(--danger); color:var(--danger); }
    .btn-danger:hover { background:var(--danger); color:white; }
    .error-msg { font-family:var(--font-mono); font-size:0.72rem; color:var(--danger); margin-top:0.75rem; text-align:center; }

    /* DASHBOARD */
    #dashboard { display:none; }
    .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
    .topbar-logo { font-family:var(--font-display); font-weight:800; font-size:1rem; }
    .topbar-logo span { color:var(--accent); }
    .topbar-tag { font-family:var(--font-mono); font-size:0.62rem; color:var(--muted); margin-left:0.5rem; }
    .topbar-right { display:flex; align-items:center; gap:1rem; }
    .topbar-user { font-family:var(--font-mono); font-size:0.72rem; color:var(--muted); }
    .dashboard-body { padding:2rem; max-width:1100px; margin:0 auto; }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:3rem; }
    .stat-card { background:var(--surface); padding:1.5rem; }
    .stat-card-num { font-family:var(--font-display); font-size:2.5rem; font-weight:800; color:var(--accent); }
    .stat-card-label { font-family:var(--font-mono); font-size:0.68rem; color:var(--muted); letter-spacing:0.1em; margin-top:0.25rem; }

    /* TABS */
    .tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:2rem; }
    .tab { font-family:var(--font-mono); font-size:0.75rem; padding:0.75rem 1.5rem; cursor:pointer; color:var(--muted); letter-spacing:0.1em; border-bottom:2px solid transparent; transition:all 0.2s; background:none; border-top:none; border-left:none; border-right:none; }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* SECTION */
    .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .section-title { font-family:var(--font-display); font-weight:700; font-size:1.1rem; }

    /* INQUIRY CARDS */
    .inquiry-list { display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:1rem; }
    .inquiry-card { background:var(--surface); padding:1.25rem 1.5rem; display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; transition:background 0.2s; }
    .inquiry-card:hover { background:var(--surface2); }
    .inquiry-card.unread { border-left:2px solid var(--accent); }
    .inquiry-name { font-weight:600; font-size:0.95rem; margin-bottom:0.15rem; }
    .inquiry-email { font-family:var(--font-mono); font-size:0.7rem; color:var(--muted); margin-bottom:0.4rem; }
    .inquiry-subject { font-size:0.85rem; color:var(--accent2); margin-bottom:0.4rem; }
    .inquiry-msg { font-size:0.85rem; color:var(--muted); line-height:1.6; }
    .inquiry-date { font-family:var(--font-mono); font-size:0.65rem; color:var(--muted); margin-top:0.5rem; }
    .inquiry-actions { display:flex; gap:0.5rem; flex-shrink:0; padding-top:0.2rem; }
    .badge-unread { font-family:var(--font-mono); font-size:0.6rem; background:rgba(0,255,157,0.1); color:var(--accent); padding:0.2rem 0.5rem; letter-spacing:0.08em; border:1px solid rgba(0,255,157,0.2); }

    /* PROJECT CARDS */
    .project-list { display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:2rem; }
    .project-card { background:var(--surface); padding:1.25rem 1.5rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; transition:background 0.2s; }
    .project-card:hover { background:var(--surface2); }
    .project-cat { font-family:var(--font-mono); font-size:0.65rem; color:var(--accent); letter-spacing:0.1em; margin-bottom:0.25rem; }
    .project-name { font-weight:600; font-size:0.95rem; }
    .project-tags { font-family:var(--font-mono); font-size:0.68rem; color:var(--muted); margin-top:0.2rem; }
    .project-actions { display:flex; gap:0.5rem; flex-shrink:0; }

    /* ADD PROJECT FORM */
    .add-form { background:var(--surface); border:1px solid var(--border); padding:2rem; }
    .add-form-title { font-family:var(--font-display); font-weight:700; font-size:1rem; color:var(--accent); margin-bottom:1.5rem; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .form-msg { font-family:var(--font-mono); font-size:0.72rem; margin-left:1rem; }
    .form-msg.ok  { color:var(--accent); }
    .form-msg.err { color:var(--danger); }
    .checkbox-row { display:flex; align-items:flex-end; gap:1rem; padding-bottom:0.1rem; }
    .checkbox-label { font-family:var(--font-mono); font-size:0.7rem; color:var(--muted); letter-spacing:0.1em; display:flex; align-items:center; gap:0.5rem; cursor:pointer; }

    .empty-state { padding:3rem; text-align:center; font-family:var(--font-mono); font-size:0.78rem; color:var(--muted); letter-spacing:0.08em; }

    @media (max-width:640px) {
      .form-row { grid-template-columns:1fr; }
      .dashboard-body { padding:1rem; }
      .inquiry-card { flex-direction:column; }
      nav .nav-links { display:none; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <img src="/static/assets/logo-mark.png" alt="" class="login-mark">
    <div class="login-logo">Vibez<span>Protocol</span></div>
    <div class="login-sub">ADMIN DASHBOARD</div>
    <div class="field">
      <label>USERNAME</label>
      <input type="text" id="loginUsername" placeholder="olamilekan" autocomplete="username">
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-accent" style="width:100%" onclick="handleLogin()">LOGIN →</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo"><img src="/static/assets/logo-mark.png" alt="" class="topbar-mark">Vibez<span>Protocol</span><span class="topbar-tag">ADMIN</span></div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbarUser"></span>
      <button class="btn btn-outline btn-sm" onclick="handleLogout()">LOGOUT</button>
    </div>
  </div>

  <div class="dashboard-body">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-card-num" id="statInquiries">—</div><div class="stat-card-label">TOTAL INQUIRIES</div></div>
      <div class="stat-card"><div class="stat-card-num" id="statUnread">—</div><div class="stat-card-label">UNREAD</div></div>
      <div class="stat-card"><div class="stat-card-num" id="statProjects">—</div><div class="stat-card-label">TOTAL PROJECTS</div></div>
      <div class="stat-card"><div class="stat-card-num" id="statVisible">—</div><div class="stat-card-label">VISIBLE</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab(event,'inquiries')">INQUIRIES</button>
      <button class="tab" onclick="switchTab(event,'projects')">PROJECTS</button>
    </div>

    <!-- Inquiries Tab -->
    <div class="tab-content active" id="tab-inquiries">
      <div class="section-header">
        <div class="section-title">Contact Inquiries</div>
        <button class="btn btn-outline btn-sm" onclick="loadInquiries()">↻ REFRESH</button>
      </div>
      <div class="inquiry-list" id="inquiryList">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

    <!-- Projects Tab -->
    <div class="tab-content" id="tab-projects">
      <div class="section-header">
        <div class="section-title">Portfolio Projects</div>
        <button class="btn btn-outline btn-sm" onclick="loadProjects()">↻ REFRESH</button>
      </div>
      <div class="project-list" id="projectList">
        <div class="empty-state">Loading...</div>
      </div>

      <div class="add-form">
        <div class="add-form-title">+ ADD NEW PROJECT</div>
        <div class="form-row">
          <div class="field"><label>TITLE *</label><input type="text" id="pTitle" placeholder="Project name"></div>
          <div class="field"><label>CATEGORY *</label><input type="text" id="pCategory" placeholder="AI AUTOMATION"></div>
        </div>
        <div class="field"><label>DESCRIPTION *</label><textarea id="pDesc" placeholder="What did you build and how does it help?"></textarea></div>
        <div class="form-row">
          <div class="field"><label>TAGS (comma-separated)</label><input type="text" id="pTags" placeholder="Python, FastAPI, OpenAI"></div>
          <div class="field"><label>LIVE URL</label><input type="text" id="pUrl" placeholder="https://..."></div>
        </div>
        <div class="form-row">
          <div class="field"><label>IMAGE URL (screenshot)</label><input type="text" id="pImage" placeholder="https://..."></div>
          <div class="field checkbox-row">
            <label class="checkbox-label"><input type="checkbox" id="pFeatured"> MARK AS FEATURED</label>
          </div>
        </div>
        <div style="display:flex;align-items:center;margin-top:0.5rem">
          <button class="btn btn-accent" onclick="addProject()">ADD PROJECT</button>
          <span class="form-msg" id="projectMsg"></span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // ── CONFIG ─────────────────────────────────────────────────────────────
  // Relative on purpose: this page is served by the same app as the API, so
  // "/api" resolves correctly both locally and on any deployed host. Nothing
  // to change when the domain changes.
  const API = '/api';

  let token = localStorage.getItem('vp_admin_token') || '';

  // ── AUTH ────────────────────────────────────────────────────────────────
  async function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl  = document.getElementById('loginError');
    errorEl.textContent = '';

    if (!username || !password) { errorEl.textContent = 'Fill in both fields.'; return; }

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      if (!res.ok) { errorEl.textContent = 'Wrong username or password.'; return; }

      const data = await res.json();
      token = data.access_token;
      localStorage.setItem('vp_admin_token', token);
      showDashboard(username);
    } catch {
      errorEl.textContent = 'Cannot reach server. Is it running?';
    }
  }

  function handleLogout() {
    token = '';
    localStorage.removeItem('vp_admin_token');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginWrap').style.display = 'flex';
  }

  window.addEventListener('load', () => {
    if (token) showDashboard('Admin');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('loginWrap').style.display !== 'none') handleLogin();
  });

  function showDashboard(username) {
    document.getElementById('loginWrap').style.display  = 'none';
    document.getElementById('dashboard').style.display  = 'block';
    document.getElementById('topbarUser').textContent   = username.toUpperCase();
    loadStats(); loadInquiries(); loadProjects();
  }

  // ── API HELPER ──────────────────────────────────────────────────────────
  async function apiFetch(path, options = {}) {
    const res = await fetch(`${API}${path}`, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers || {}) },
    });
    if (res.status === 401) { handleLogout(); return null; }
    return res;
  }

  // ── TABS ────────────────────────────────────────────────────────────────
  function switchTab(e, name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  // ── STATS ───────────────────────────────────────────────────────────────
  async function loadStats() {
    const res = await apiFetch('/admin/stats');
    if (!res || !res.ok) return;
    const d = await res.json();
    document.getElementById('statInquiries').textContent = d.total_inquiries;
    document.getElementById('statUnread').textContent    = d.unread_inquiries;
    document.getElementById('statProjects').textContent  = d.total_projects;
    document.getElementById('statVisible').textContent   = d.visible_projects;
  }

  // ── INQUIRIES ───────────────────────────────────────────────────────────
  async function loadInquiries() {
    const res = await apiFetch('/admin/inquiries');
    if (!res || !res.ok) return;
    const data = await res.json();
    const list = document.getElementById('inquiryList');

    if (!data.length) { list.innerHTML = '<div class="empty-state">NO INQUIRIES YET</div>'; return; }

    list.innerHTML = data.map(i => `
      <div class="inquiry-card ${i.is_read ? '' : 'unread'}" id="inq-${i.id}">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.2rem">
            <div class="inquiry-name">${escHtml(i.name)}</div>
            ${!i.is_read ? '<span class="badge-unread">UNREAD</span>' : ''}
          </div>
          <div class="inquiry-email">${escHtml(i.email)}</div>
          <div class="inquiry-subject">${escHtml(i.subject)}</div>
          <div class="inquiry-msg">${escHtml(i.message)}</div>
          <div class="inquiry-date">${new Date(i.created_at).toLocaleString()}</div>
        </div>
        <div class="inquiry-actions">
          ${!i.is_read ? `<button class="btn btn-outline btn-sm" onclick="markRead(${i.id})">MARK READ</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="deleteInquiry(${i.id})">DELETE</button>
        </div>
      </div>
    `).join('');
  }

  async function markRead(id) {
    await apiFetch(`/admin/inquiries/${id}/read`, { method: 'PUT' });
    loadInquiries(); loadStats();
  }

  async function deleteInquiry(id) {
    if (!confirm('Delete this inquiry permanently?')) return;
    await apiFetch(`/admin/inquiries/${id}`, { method: 'DELETE' });
    loadInquiries(); loadStats();
  }

  // ── PROJECTS ────────────────────────────────────────────────────────────
  async function loadProjects() {
    const res = await apiFetch('/projects');
    if (!res || !res.ok) return;
    const data = await res.json();
    const list = document.getElementById('projectList');

    if (!data.length) { list.innerHTML = '<div class="empty-state">NO PROJECTS YET — ADD ONE BELOW</div>'; return; }

    list.innerHTML = data.map(p => `
      <div class="project-card">
        <div>
          <div class="project-cat">${escHtml(p.category)}${p.is_featured ? ' ⭐' : ''}</div>
          <div class="project-name">${escHtml(p.title)}</div>
          ${p.tags ? `<div class="project-tags">${escHtml(p.tags)}</div>` : ''}
        </div>
        <div class="project-actions">
          <button class="btn btn-danger btn-sm" onclick="deleteProject(${p.id})">DELETE</button>
        </div>
      </div>
    `).join('');
  }

  async function addProject() {
    const title    = document.getElementById('pTitle').value.trim();
    const category = document.getElementById('pCategory').value.trim();
    const desc     = document.getElementById('pDesc').value.trim();
    const msgEl    = document.getElementById('projectMsg');

    if (!title || !category || !desc) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Title, category and description are required.';
      return;
    }

    const payload = {
      title, category, description: desc,
      tags:        document.getElementById('pTags').value.trim()  || null,
      url:         document.getElementById('pUrl').value.trim()   || null,
      image_url:   document.getElementById('pImage').value.trim() || null,
      is_featured: document.getElementById('pFeatured').checked,
    };

    const res = await apiFetch('/projects', { method: 'POST', body: JSON.stringify(payload) });

    if (res && res.ok) {
      msgEl.className   = 'form-msg ok';
      msgEl.textContent = '✅ Project added!';
      ['pTitle','pCategory','pDesc','pTags','pUrl','pImage'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('pFeatured').checked = false;
      loadProjects(); loadStats();
      setTimeout(() => msgEl.textContent = '', 3000);
    } else {
      msgEl.className   = 'form-msg err';
      msgEl.textContent = '❌ Failed to add project.';
    }
  }

  async function deleteProject(id) {
    if (!confirm('Remove this project from portfolio?')) return;
    await apiFetch(`/projects/${id}`, { method: 'DELETE' });
    loadProjects(); loadStats();
  }

  // ── UTILS ────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
